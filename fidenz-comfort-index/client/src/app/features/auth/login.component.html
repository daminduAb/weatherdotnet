<div
  class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100"
  *ngIf="!(isLoading$ | async); else loadingTpl"
>

  <ng-container *ngIf="!(isAuthenticated$ | async); else profileTpl">
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-10 text-center max-w-xs w-11/12">
      <h1 class="text-xl font-semibold mb-2">Comfort Index</h1>
      <p class="text-gray-500 dark:text-gray-400 mb-6">Sign in to view the weather comfort dashboard.</p>
      <button
        class="px-6 py-2 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700"
        (click)="login()"
      >
        Log In
      </button>
    </div>
  </ng-container>

  <ng-template #profileTpl>
    <div
      class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-10 text-center max-w-xs w-11/12"
      *ngIf="user$ | async as user"
    >
      <img
        class="w-16 h-16 rounded-full mx-auto mb-2"
        [src]="user.picture"
        [alt]="user.name"
        *ngIf="user.picture"
      />
      <h2 class="text-lg font-medium mt-2 mb-1">Welcome, {{ user.name }}</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">{{ user.email }}</p>
      <button
        class="px-6 py-2 rounded-lg font-semibold border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700"
        (click)="logout()"
      >
        Log Out
      </button>
    </div>
  </ng-template>

</div>

<ng-template #loadingTpl>
  <div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    Checking session...
  </div>
</ng-template>
